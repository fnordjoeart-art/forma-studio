<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-hYG858XlOeblYn+9bIzp1ggt0ATTSZU86R9fMy5C0xc='; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>FORMA</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f4f2ed;
      color: #171714;
    }

    main {
      width: min(640px, 100%);
      padding: 64px 48px;
      border: 1px solid #dedbd2;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(23, 23, 20, 0.08);
    }

    .screen {
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: #65645d;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(48px, 10vw, 80px);
    }

    h2 {
      margin-bottom: 28px;
      font-size: 36px;
    }

    .status {
      margin: 24px 0 36px;
      font-size: 20px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      background: #171714;
      color: #ffffff;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #36362f;
      outline: 3px solid rgba(23, 23, 20, 0.2);
    }

    .secondary {
      border: 1px solid #cbc8bf;
      background: transparent;
      color: #171714;
    }

    .catalog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .catalog-header .eyebrow {
      margin: 0;
    }

    .product-card {
      padding: 28px;
      border: 1px solid #dedbd2;
      border-radius: 18px;
      background: #faf9f6;
      text-align: left;
    }

    .product-card h3 {
      margin-bottom: 10px;
      font-size: 26px;
    }

    .description {
      margin: 0 0 20px;
      color: #55544e;
      line-height: 1.5;
    }

    .price {
      margin: 0 0 24px;
      font-size: 24px;
      font-weight: 700;
    }

    .message {
      margin: 20px 0 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: #e9f2e8;
      color: #244522;
    }
  </style>
</head>
<body>
  <main>
    <section id="home-screen" class="screen" aria-labelledby="forma-title">
      <p class="eyebrow">FORMA Studio Prototype</p>
      <h1 id="forma-title">FORMA</h1>
      <p class="status">Motore FORMA pronto</p>
      <button id="open-catalog" type="button">Entra nel catalogo</button>
    </section>

    <section id="catalog-screen" class="screen" aria-labelledby="catalog-title" hidden>
      <div class="catalog-header">
        <button id="back-home" class="secondary" type="button">Torna indietro</button>
        <p class="eyebrow">Catalogo</p>
      </div>
      <h2 id="catalog-title">Catalogo FORMA</h2>
      <article class="product-card">
        <h3>Vaso FORMA</h3>
        <p class="description">Oggetto stampato in 3D e personalizzabile</p>
        <p class="price">€ 19,90</p>
        <button id="customize-product" type="button">Personalizza</button>
        <p id="personalization-message" class="message" role="status" aria-live="polite" hidden>Personalizzazione disponibile nella prossima fase</p>
      </article>
    </section>
  </main>

<script>const homeScreen = document.querySelector("#home-screen");
const catalogScreen = document.querySelector("#catalog-screen");
const personalizationMessage = document.querySelector("#personalization-message");

document.querySelector("#open-catalog").addEventListener("click", () => {
  homeScreen.hidden = true;
  catalogScreen.hidden = false;
  document.querySelector("#back-home").focus();
});

document.querySelector("#back-home").addEventListener("click", () => {
  catalogScreen.hidden = true;
  homeScreen.hidden = false;
  personalizationMessage.hidden = true;
  document.querySelector("#open-catalog").focus();
});

document.querySelector("#customize-product").addEventListener("click", () => {
  personalizationMessage.hidden = false;
});
</script>
</body>
</html>
